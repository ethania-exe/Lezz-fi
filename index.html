<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lezz-Fi Chat</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
}

.header{
padding:20px;
background:#111827;
font-size:28px;
font-weight:bold;
}

.online{
color:#00ff88;
}

.chat-box{
width:90%;
max-width:600px;
height:350px;
margin:20px auto;
background:#1e293b;
border-radius:10px;
padding:10px;
overflow-y:auto;
text-align:left;
}

.message{
background:#334155;
padding:10px;
margin:8px;
border-radius:10px;
}

.input-area{
width:90%;
max-width:600px;
margin:auto;
display:flex;
gap:10px;
}

input{
flex:1;
padding:12px;
border:none;
border-radius:10px;
}

button{
padding:12px 20px;
border:none;
border-radius:10px;
background:#00ff88;
font-weight:bold;
cursor:pointer;
}

.footer{
margin-top:20px;
padding:10px;
opacity:.7;
}
</style>

</head>

<body>

<div class="header">
🔥 LEZZ-FI CHAT 🔥
<br>
<span class="online">● ONLINE</span>
</div>

<div class="chat-box">

<div class="message">
🤖 Welcome to Lezz-Fi Chat
</div>

<div class="message">
👋 Firebase connect korle real chat kaj korbe
</div>

</div>

<div class="input-area">
<input placeholder="Type message...">
<button>Send</button>
</div>

<div class="footer">
Made by Mahin.😎
</div>

</body>
</html>
