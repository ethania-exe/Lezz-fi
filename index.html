<!DOCTYPE html>
<html>
<head>
 <meta name="postimage-verification" content="9332bc8800ca040c4c82fdba3d119fa0"> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lezz-Fi</title>
  
<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
}

#join{
display:flex;
flex-direction:column;
max-width:320px;
margin:80px auto;
gap:10px;
}

#join input,#join button,#join select{
padding:12px;
border:none;
border-radius:10px;
}

#chatPage{
display:none;
}

header{
background:#111827;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
}

#chat{
height:70vh;
overflow-y:auto;
padding:10px;
}

.msg{
max-width:75%;
padding:10px;
margin:8px 0;
border-radius:12px;
word-wrap:break-word;
}

.me{
margin-left:auto;
background:#2563eb;
}

.other{
background:#334155;
}

.name{
font-size:12px;
opacity:.8;
margin-bottom:4px;
}

.time{
font-size:11px;
opacity:.7;
margin-top:4px;
}

#bottom{
display:flex;
gap:8px;
padding:10px;
}

#message{
flex:1;
padding:12px;
border:none;
border-radius:10px;
}

button{
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
}
</style>
</head>

<body>

<div id="join">
<h2> Lezz-fi Chat </h2>
  <p style="text-align:center;opacity:.7;">
 MADE BY MAHIN
</p>
  
<input id="username" placeholder="Enter your name">

<input id="photoUrl" placeholder="Profile Photo URL (Optional)">
  
<button onclick="joinChat()">Join Chat</button>
</div>

<div id="chatPage">
<header>
<button onclick="openAdmin()" style="float:left;background:none;border:none;color:white;font-size:22px;cursor:pointer;">
ꑭ
</button>

<button onclick="logout()" style="float:right;background:none;border:none;color:white;font-size:22px;cursor:pointer;">
→
</button>
</header>
  <div id="adminPanel" style="
display:none;
padding:10px;
background:#1e293b;
text-align:center;
">

<button onclick="clearAllChats()">
🗑️ Clear All Chats
</button>

</div>
<div id="chat"></div>

<div id="bottom">
<input id="message" placeholder="Type message...">
<button onclick="sendMsg()">Send</button>
</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
push,
set,
get,
child,
remove,
onChildAdded
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDN_rycfVW0HrqAlIIHfWVqumhAPQfetLs",
  authDomain: "lezz-fi.firebaseapp.com",
  databaseURL: "https://lezz-fi-default-rtdb.firebaseio.com",
  projectId: "lezz-fi",
  storageBucket: "lezz-fi.firebasestorage.app",
  messagingSenderId: "156046703842",
  appId: "1:156046703842:web:482610a2c1180dadffb2bb",
  measurementId: "G-F62GEFZ0JV"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const dbRef = ref(db);
window.joinChat = async function(){

const name =
document.getElementById("username").value.trim();

const username =
name.toLowerCase().replace(/\s+/g,'');

const photoUrl =
document.getElementById("photoUrl").value.trim();
if(!name){
alert("Enter your name");
return;
}

const snap =
await get(child(dbRef,"users/"+username));

if(!snap.exists()){

await set(ref(db,"users/"+username),{
name:name,
});

}

localStorage.setItem("lezzfi_name",name);
localStorage.setItem("lezzfi_photo",photoUrl);
document.getElementById("join").style.display="none";
document.getElementById("chatPage").style.display="block";

}

const savedName =
localStorage.getItem("lezzfi_name");

if(savedName){
document.getElementById("join").style.display="none";
document.getElementById("chatPage").style.display="block";
}

window.sendMsg = function(){

const name =
localStorage.getItem("lezzfi_name");

const message =
document.getElementById("message").value.trim();

if(!message) return;

push(ref(db,"messages"),{
name:name,
photo:localStorage.getItem("lezzfi_photo"),
message:message,
time:new Date().toLocaleTimeString()
});

document.getElementById("message").value="";
}

onChildAdded(ref(db,"messages"),(data)=>{

const m=data.val();

const myName =
localStorage.getItem("lezzfi_name");

const div =
document.createElement("div");

div.className =
"msg " + (m.name===myName ? "me":"other");

div.innerHTML =
`
<div style="display:flex;gap:8px;align-items:flex-start;">

<img src="${m.photo || 'https://i.imgur.com/4M34hi2.png'}"
style="
width:40px;
height:40px;
border-radius:50%;
object-fit:cover;
">

<div>
<div>${m.message}</div>
<div class="time">${m.time}</div>
</div>

</div>
`;
document.getElementById("chat")
.appendChild(div);

document.getElementById("chat")
.scrollTop =
document.getElementById("chat")
.scrollHeight;

});
  window.openAdmin = function(){

const pass = prompt("Admin Password");

if(pass === "AP162905"){

document.getElementById("adminPanel")
.style.display="block";

}else{
alert("Wrong Password");
}

}
window.logout = function(){

localStorage.removeItem("lezzfi_name");
localStorage.removeItem("lezzfi_photo");

location.reload();

}

window.clearAllChats = function(){

if(confirm("Delete ALL chats?")){

remove(ref(db,"messages"));

alert("All Chats Deleted");

location.reload();

}

}
</script>

</body>
</html>
