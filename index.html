<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lezz‑Fi Chat v2.0</title>
<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#fff}
#join{display:flex;flex-direction:column;gap:10px;max-width:320px;margin:80px auto}
input,button{padding:12px;border-radius:10px;border:none}
button{cursor:pointer}
#chatPage{display:none}
header{padding:12px;text-align:center;background:#111827}
#chat{height:70vh;overflow:auto;padding:10px}
.msg{max-width:75%;padding:10px;border-radius:12px;margin:8px 0}
.me{margin-left:auto;background:#2563eb}
.other{background:#334155}
.time{font-size:11px;opacity:.8;margin-top:4px}
#bottom{display:flex;gap:8px;padding:10px}
#message{flex:1}
</style>
</head>
<body>

<div id="join">
<h2>🔥 Lezz‑Fi Chat</h2>
<input id="username" placeholder="Enter your name">
<button onclick="joinChat()">Join Chat</button>
</div>

<div id="chatPage">
<header><h2>🔥 Lezz‑Fi Chat v2.0</h2></header>
<div id="chat"></div>
<div id="bottom">
<input id="message" placeholder="Type a message">
<button onclick="sendLocal()">Send</button>
</div>
</div>

<script>
function joinChat(){
 const n=document.getElementById('username').value.trim();
 if(!n) return alert('Enter name');
 localStorage.setItem('lezzfi_name',n);
 document.getElementById('join').style.display='none';
 document.getElementById('chatPage').style.display='block';
}

if(localStorage.getItem('lezzfi_name')){
 document.getElementById('join').style.display='none';
 document.getElementById('chatPage').style.display='block';
}

function sendLocal(){
 const box=document.getElementById('chat');
 const txt=document.getElementById('message').value.trim();
 if(!txt) return;
 const div=document.createElement('div');
 div.className='msg me';
 const t=new Date().toLocaleTimeString();
 div.innerHTML=txt+'<div class="time">'+t+'</div>';
 box.appendChild(div);
 document.getElementById('message').value='';
 box.scrollTop=box.scrollHeight;
}
</script>
</body>
</html>
